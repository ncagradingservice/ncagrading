<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCA Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#030609;color:#fff;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:28px 16px 80px}.box{padding:20px;border:1px solid #244c78;border-radius:18px;background:#07101a;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;color:#8ba0b7;font-weight:800}input,textarea,button{width:100%;padding:13px;margin:5px 0 10px;border-radius:10px;border:1px solid #263a50;background:#03080e;color:#fff}textarea{min-height:100px}button{background:#1478ef;font-weight:900}.danger{background:#5d111b;border-color:#a32d3c}#editor{display:none}#qrbox{text-align:center;display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>NCA Admin</h1><div class="box" id="login"><label>E-MAIL<input id="email" type="email" value="nca.grading.service@gmail.com"></label><label>HASŁO<input id="password" type="password"></label><button onclick="doLogin()">ZALOGUJ</button><p id="loginMsg"></p></div>
<div id="editor"><div class="box"><h2>Dodaj / edytuj certyfikat</h2><div class="grid">
<label>Numer certyfikatu<input id="cert_number" placeholder="2"></label><label>Nazwa karty<input id="card_name"></label><label>Rok<input id="year" type="number"></label><label>Set<input id="set_name"></label><label>Numer karty<input id="card_number"></label><label>Język<input id="language"></label><label>Rarity<input id="rarity"></label><label>Ocena<input id="grade" type="number" step=".1"></label><label>Grade label<input id="grade_label" placeholder="GEM MINT"></label><label>Data gradingu<input id="graded_on" type="date"></label><label>Centering<input id="centering" type="number" step=".1"></label><label>Corners<input id="corners" type="number" step=".1"></label><label>Edges<input id="edges" type="number" step=".1"></label><label>Surface<input id="surface" type="number" step=".1"></label><label>Population higher<input id="population_higher" type="number" value="0"></label><label>Same<input id="population_same" type="number" value="1"></label><label>Lower<input id="population_lower" type="number" value="0"></label></div>
<label>Opis / uzasadnienie oceny<textarea id="grading_notes" placeholder="Np. bardzo mocny egzemplarz; PERFECT nie został przyznany z powodu..."></textarea></label>
<button type="button" onclick="generateDescription()">✨ GENERUJ OPIS AUTOMATYCZNIE</button>
<label>Zdjęcie karty (opcjonalnie, JPG/PNG/WebP do 5 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<button onclick="save()">ZAPISZ CERTYFIKAT</button><p id="saveMsg"></p></div>
<div class="box"><h2>Generator QR</h2>
<p style="color:#8ba0b7">Wpisz numer certyfikatu. Po zapisaniu certyfikatu QR wygeneruje się również automatycznie.</p>
<input id="qrCertNum" placeholder="Numer certyfikatu, np. 2">
<button type="button" onclick="manualQR()">GENERUJ KOD QR</button>
<div id="manualQrBox" style="text-align:center;display:none;margin-top:16px">
<canvas id="manualQr"></canvas>
<p id="manualQrUrl" style="font-size:12px;word-break:break-all;color:#8ba0b7"></p>
<button type="button" onclick="downloadQR('manualQr')">POBIERZ KOD QR (PNG)</button>
<button type="button" onclick="copyManualQR()">KOPIUJ LINK</button>
<button type="button" onclick="openManualQR()">OTWÓRZ CERTYFIKAT</button>
</div></div>
<div class="box"><h2>Wczytaj / usuń</h2><input id="loadNum" placeholder="np. 2"><button onclick="loadCert()">WCZYTAJ DO EDYCJI</button><button class="danger" onclick="delCert()">USUŃ CERTYFIKAT</button><button onclick="logout()">WYLOGUJ</button></div>
<div class="box" id="qrbox"><h2>Kod QR certyfikatu</h2><canvas id="qr"></canvas><p id="qrurl"></p><button onclick="downloadQR('qr')">POBIERZ KOD QR (PNG)</button><button onclick="copyLink()">KOPIUJ LINK</button><button onclick="openCert()">OTWÓRZ CERTYFIKAT</button></div></div>
<script>
const SB=supabase.createClient('https://iwdbchfizkfkzrdcbtjq.supabase.co','sb_publishable_prvLYudXtQdsxm0dnMm4Gg_Hrl2CsCK');
const ids=['cert_number','card_name','year','set_name','card_number','language','rarity','grade','grade_label','graded_on','centering','corners','edges','surface','population_higher','population_same','population_lower','grading_notes'];let lastUrl='';
async function refresh(){const {data}=await SB.auth.getSession();login.style.display=data.session?'none':'block';editor.style.display=data.session?'block':'none'}
async function doLogin(){const {error}=await SB.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?error.message:'';refresh()}
async function logout(){await SB.auth.signOut();refresh()}
function certUrl(n){
 const u=new URL(window.location.href);
 u.pathname=u.pathname.replace(/\/admin(?:-NCA-zdjecia-usuwanie-QR)?\.html$/i,'/index.html');
 u.search='?cert='+encodeURIComponent(n);
 u.hash='';
 return u.href;
}
function makeQR(n){lastUrl=certUrl(n);qrbox.style.display='block';qrurl.textContent=lastUrl;renderQrRobust('qr',lastUrl)}
function generateDescription(){
 const g=Number(document.getElementById('grade').value);
 const label=(document.getElementById('grade_label').value||'').trim().toUpperCase();
 const fields=[
  ['centrowanie','Centering','centering'],
  ['narożniki','Corners','corners'],
  ['krawędzie','Edges','edges'],
  ['powierzchnia','Surface','surface']
 ].map(([pl,en,id])=>({pl,en,v:Number(document.getElementById(id).value)})).filter(x=>Number.isFinite(x.v)&&document.getElementById(x.en.toLowerCase()).value!=='');
 if(!Number.isFinite(g)){ alert('Najpierw wpisz ocenę końcową.'); return; }
 let text='';
 if(fields.length){
   const sorted=[...fields].sort((a,b)=>a.v-b.v);
   const best=Math.max(...fields.map(x=>x.v));
   const low=sorted[0];
   if(g===10 && label.includes('PERFECT')){
     text='Wyjątkowy egzemplarz prezentujący najwyższy poziom jakości w ocenianych elementach. Centrowanie, narożniki, krawędzie i powierzchnia spełniają standard wymagany dla oceny NCA 10 PERFECT.';
   } else if(g===10){
     text=`Wyjątkowo dobrze zachowany egzemplarz o bardzo wysokiej jakości. Karta prezentuje mocne parametry w ocenianych obszarach. Największy wpływ na ocenę miał parametr ${low.pl}, który uzyskał ${low.v.toFixed(1)}. Karta otrzymała ocenę NCA 10 ${label||'GEM MINT'}, jednak nie spełniła kryteriów PERFECT.`;
   } else if(g>=9){
     text=`Bardzo dobrze zachowany egzemplarz o wysokiej jakości. Najmocniejsze oceniane elementy osiągają poziom do ${best.toFixed(1)}, natomiast największy wpływ na ocenę miał parametr ${low.pl} z wynikiem ${low.v.toFixed(1)}. Końcowa ocena NCA to ${g.toFixed(1).replace('.0','')} ${label}.`;
   } else {
     text=`Egzemplarz został oceniony na podstawie centrowania, narożników, krawędzi i powierzchni. Największy wpływ na ocenę miał parametr ${low.pl} z wynikiem ${low.v.toFixed(1)}. Końcowa ocena NCA to ${g.toFixed(1).replace('.0','')} ${label}.`;
   }
 } else {
   text=`Karta otrzymała końcową ocenę NCA ${g.toFixed(1).replace('.0','')} ${label}. Uzupełnij subgrades, aby generator mógł przygotować dokładniejsze uzasadnienie oceny.`;
 }
 document.getElementById('grading_notes').value=text.replace(/\s+/g,' ').trim();
}
async function save(){
 if(!document.getElementById('grading_notes').value.trim()){
   generateDescription();
 }
 let x={};ids.forEach(id=>x[id]=document.getElementById(id).value||null);if(!x.cert_number||!x.card_name||!x.grade||!x.grade_label){saveMsg.textContent='Uzupełnij numer, nazwę, ocenę i grade label.';return}
 ['year','grade','centering','corners','edges','surface','population_higher','population_same','population_lower'].forEach(k=>{if(x[k]!=null)x[k]=Number(x[k])});
 const f=photo.files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=x.cert_number+'.'+ext;const {error:ue}=await SB.storage.from('card-images').upload(path,f,{upsert:true,contentType:f.type});if(ue){saveMsg.textContent='Błąd zdjęcia: '+ue.message;return}x.image_url=SB.storage.from('card-images').getPublicUrl(path).data.publicUrl}
 x.status='CERTYFIKAT NCA';x.updated_at=new Date().toISOString();const {error}=await SB.from('certificates').upsert(x,{onConflict:'cert_number'});
 saveMsg.textContent=error?error.message:'✓ Zapisano. Certyfikat #'+x.cert_number+' jest dostępny.';if(!error){
 makeQR(x.cert_number);
 document.getElementById('qrCertNum').value=x.cert_number;
 manualQR();
}
}
async function loadCert(){const n=loadNum.value.trim();const {data,error}=await SB.from('certificates').select('*').eq('cert_number',n).maybeSingle();if(error||!data)return alert('Nie znaleziono certyfikatu');ids.forEach(id=>document.getElementById(id).value=data[id]??'');makeQR(n);scrollTo(0,0)}
async function delCert(){const n=(loadNum.value.trim()||cert_number.value.trim());if(!n)return alert('Wpisz numer certyfikatu');if(!confirm('Na pewno usunąć certyfikat #'+n+'?'))return;const {data}=await SB.from('certificates').select('image_url').eq('cert_number',n).maybeSingle();const {error}=await SB.from('certificates').delete().eq('cert_number',n);if(error)return alert(error.message);if(data?.image_url){try{let name=decodeURIComponent(data.image_url.split('/card-images/')[1]);if(name)await SB.storage.from('card-images').remove([name])}catch(e){}}alert('Usunięto certyfikat #'+n);qrbox.style.display='none'}
function copyLink(){navigator.clipboard.writeText(lastUrl);alert('Skopiowano link')}
function openCert(){window.open(lastUrl,'_blank')}
document.getElementById('cert_number').addEventListener('input',e=>{
 const n=e.target.value.trim();
 if(n) makeQR(n); else qrbox.style.display='none';
});

function qrApiUrl(url,size=320){
 return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&margin=12&data='+encodeURIComponent(url);
}
function renderQrRobust(canvasId,url){
 const canvas=document.getElementById(canvasId);
 if(!canvas)return;
 const parent=canvas.parentElement;
 let img=document.getElementById(canvasId+'Img');
 if(!img){
   img=document.createElement('img');
   img.id=canvasId+'Img';
   img.alt='Kod QR certyfikatu';
   img.style.cssText='display:none;width:240px;height:240px;max-width:100%;margin:12px auto;background:#fff;padding:8px;border-radius:12px';
   canvas.insertAdjacentElement('afterend',img);
 }
 if(window.QRCode && QRCode.toCanvas){
   QRCode.toCanvas(canvas,url,{width:240,margin:2},err=>{
     if(err){canvas.style.display='none';img.src=qrApiUrl(url,320);img.style.display='block'}
     else {canvas.style.display='inline-block';img.style.display='none'}
   });
 } else {
   canvas.style.display='none';img.src=qrApiUrl(url,320);img.style.display='block';
 }
}
async function downloadQR(baseId){
 const n=(baseId==='manualQr' ? (document.getElementById('qrCertNum').value.trim()||document.getElementById('cert_number').value.trim()) : document.getElementById('cert_number').value.trim());
 if(!n){alert('Najpierw wpisz numer certyfikatu');return}
 const url=certUrl(n);
 try{
   const response=await fetch(qrApiUrl(url,1000));
   const blob=await response.blob();
   const a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   a.download='NCA-certyfikat-'+n+'-QR.png';
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }catch(e){
   window.open(qrApiUrl(url,1000),'_blank');
 }
}

function manualQR(){
 const n=document.getElementById('qrCertNum').value.trim() || document.getElementById('cert_number').value.trim();
 if(!n){alert('Wpisz numer certyfikatu');return}
 const u=certUrl(n);
 const box=document.getElementById('manualQrBox');
 box.style.display='block';
 document.getElementById('manualQrUrl').textContent=u;
 renderQrRobust('manualQr',u);
}
function copyManualQR(){
 const u=document.getElementById('manualQrUrl').textContent;
 if(u) navigator.clipboard.writeText(u).then(()=>alert('Skopiowano link'));
}
function openManualQR(){
 const u=document.getElementById('manualQrUrl').textContent;
 if(u) window.open(u,'_blank');
}
refresh();
</script></main></body></html>
